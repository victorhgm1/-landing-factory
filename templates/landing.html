<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}} · {{EMPRESA}}</title>
<meta name="description" content="{{SUBTITULO}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --campo:{{CAMPO}}; --wash1:{{WASH1}}; --wash3:{{WASH3}};
    --acento:{{ACENTO}}; --creme:{{CREME}}; --ink:{{INK}};
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--wash1);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--campo)}

  .hero{background:var(--campo);color:var(--creme);padding:64px 24px 88px;text-align:center}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.85;margin-bottom:18px}
  h1{font-family:Lora,serif;font-weight:600;font-size:clamp(30px,6vw,46px);line-height:1.15;max-width:640px;margin:0 auto 14px}
  .traco{width:44px;height:3px;background:var(--acento);border:0;border-radius:2px;margin:0 auto 18px}
  .sub{font-size:clamp(16px,2.6vw,19px);max-width:560px;margin:0 auto;opacity:.94}

  .card{background:#fff;max-width:460px;margin:-48px auto 0;padding:30px 26px;border-radius:14px;box-shadow:0 10px 30px rgba(26,26,23,.12)}
  .card label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  .card input[type=text],.card input[type=email],.card input[type=tel]{
    width:100%;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);
    border:1.5px solid var(--wash3);border-radius:8px;background:#fff}
  .card input:focus{outline:2px solid var(--campo);outline-offset:1px;border-color:var(--campo)}
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:400;line-height:1.5;margin:16px 0 18px}
  .consent input{margin-top:3px;accent-color:var(--campo);width:16px;height:16px;flex:none}
  .btn{width:100%;background:var(--acento);color:var(--ink);font-family:Inter,sans-serif;font-weight:600;font-size:17px;border:0;border-radius:8px;padding:16px;cursor:pointer;transition:filter .15s}
  .btn:hover{filter:brightness(.95)}
  .btn:focus-visible{outline:3px solid var(--campo);outline-offset:2px}
  .btn[disabled]{opacity:.6;cursor:wait}
  .erro{display:none;background:#FBEAE7;color:#7C2A1C;padding:11px 13px;border-radius:8px;font-size:14px;margin-top:14px}
  .privacidade-nota{font-size:12px;text-align:center;margin-top:14px;opacity:.7}

  .beneficios{max-width:460px;margin:36px auto;padding:0 26px}
  .beneficios h2{font-family:Lora,serif;font-weight:600;font-size:21px;color:var(--campo);margin-bottom:12px}
  .beneficios ul{list-style:none}
  .beneficios li{position:relative;padding-left:28px;margin:10px 0}
  .beneficios li::before{content:"";position:absolute;left:0;top:11px;width:15px;height:3px;background:var(--acento);border-radius:2px}

  footer{padding:36px 24px 44px;text-align:center;font-size:13px;opacity:.85}
  .marca{font-family:Lora,serif;font-weight:600;font-size:16px;color:var(--campo);margin-bottom:6px}
  footer p{margin:3px 0}

  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="hero">
  <p class="kicker">{{KICKER}}</p>
  <h1>{{TITULO}}</h1>
  <hr class="traco">
  <p class="sub">{{SUBTITULO}}</p>
</section>

<main>
  <div class="card">
    <form id="captura" data-grupo="{{GRUPO_ID}}">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" required autocomplete="name">

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email" inputmode="email">
      {{CAMPO_WHATSAPP}}
      <input class="hp" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">

      <label class="consent">
        <input type="checkbox" name="consentimento" required>
        <span>{{CONSENTIMENTO}} <a href="{{POLITICA_URL}}" target="_blank" rel="noopener">Política de Privacidade</a>.</span>
      </label>

      <button class="btn" type="submit">{{BOTAO}}</button>
      <p class="erro" id="erro" role="alert"></p>
      <p class="privacidade-nota">Seus dados ficam seguros. Nada de spam.</p>
    </form>
  </div>

  <section class="beneficios">
    <h2>O que você recebe</h2>
    <ul>
      {{BENEFICIOS}}
    </ul>
  </section>
</main>

<footer>
  <p class="marca">{{EMPRESA}}</p>
  <p>{{ENDERECO}}</p>
  <p><a href="{{POLITICA_URL}}" target="_blank" rel="noopener">Política de Privacidade</a> · © {{ANO}}</p>
</footer>

<script>
  const form = document.getElementById('captura');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    const erro = document.getElementById('erro');
    btn.disabled = true;
    erro.style.display = 'none';

    const dados = Object.fromEntries(new FormData(form));
    dados.grupo = form.dataset.grupo;

    try {
      const r = await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });
      if (r.ok) { location.href = 'obrigado.html'; return; }
      const j = await r.json().catch(() => ({}));
      erro.textContent = j.mensagem || 'Não foi possível concluir. Tente de novo em instantes.';
      erro.style.display = 'block';
    } catch (_) {
      erro.textContent = 'Falha de conexão. Verifique sua internet e tente de novo.';
      erro.style.display = 'block';
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
